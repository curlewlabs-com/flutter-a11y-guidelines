name: flutter_a11y_guidelines
description: >-
  Accessibility guidelines for Flutter widget tests: AAA text contrast from
  declared colors, contrast in hover, press and focus states, non-text graphic
  contrast, and semantics label, heading, title and locale checks.
version: 0.1.0
repository: https://github.com/curlewlabs-com/flutter-a11y-guidelines
issue_tracker: https://github.com/curlewlabs-com/flutter-a11y-guidelines/issues
# Distributed from GitHub only.
publish_to: none

# The lower bounds are the release CI tests on, which is the oldest this
# package is known to work with; the semantics flag and color APIs it reads
# are recent.
environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # A runtime dependency, not a dev one: the guidelines are flutter_test types.
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0
